<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - LocalShop Cashback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav><a href="register.html">Register</a><a href="login.html">Login</a><a href="dashboard.html">Dashboard</a></nav>
<div class="container">
    <h1>Forgot Password</h1>

    <!-- STEP 1: Enter email, send OTP -->
    <div id="step1">
        <label>Email</label>
        <input type="email" id="email" required>
        <button id="sendOtpBtn">Send OTP</button>
    </div>

    <!-- STEP 2: Enter OTP + new password (hidden until OTP is sent) -->
    <div id="step2" style="display:none;">
        <label>Enter OTP (check backend console)</label>
        <input type="text" id="otp" maxlength="6">

        <label>New Password (min 8 characters)</label>
        <input type="password" id="newPassword">

        <button id="resetBtn">Reset Password</button>
    </div>

    <div id="msg"></div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api";

    async function parseResponse(res) {
        const contentType = res.headers.get("content-type");
        return contentType && contentType.includes("application/json")
            ? await res.json()
            : await res.text();
    }

    document.getElementById('sendOtpBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;

        if (!email) {
            document.getElementById('msg').innerHTML = `<div class="msg error">Please enter your email.</div>`;
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/users/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await parseResponse(res);

            if (res.ok) {
                document.getElementById('msg').innerHTML =
                    `<div class="msg success">${data} Check the backend (IntelliJ) console for your OTP.</div>`;
                document.getElementById('step2').style.display = 'block';
            } else {
                document.getElementById('msg').innerHTML = `<div class="msg error">${data}</div>`;
            }
        } catch (err) {
            document.getElementById('msg').innerHTML =
                `<div class="msg error">Could not reach backend. Is Spring Boot running on port 8080?</div>`;
        }
    });

    document.getElementById('resetBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const otp = document.getElementById('otp').value;
        const newPassword = document.getElementById('newPassword').value;

        if (newPassword.length < 8) {
            document.getElementById('msg').innerHTML =
                `<div class="msg error">Password must be at least 8 characters long.</div>`;
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/users/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp, newPassword })
            });
            const data = await parseResponse(res);

            if (res.ok) {
                document.getElementById('msg').innerHTML =
                    `<div class="msg success">${data} Redirecting to login...</div>`;
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                document.getElementById('msg').innerHTML = `<div class="msg error">${data}</div>`;
            }
        } catch (err) {
            document.getElementById('msg').innerHTML =
                `<div class="msg error">Could not reach backend. Is Spring Boot running on port 8080?</div>`;
        }
    });
</script>
</body>
</html>
