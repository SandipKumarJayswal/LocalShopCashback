<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - LocalShop Cashback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav><a href="register.html">Register</a><a href="login.html">Login</a><a href="dashboard.html">Dashboard</a></nav>
<div class="container">
    <h1>Create your account</h1>
    <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <label>Role</label>
        <select id="role">
            <option value="CUSTOMER">Customer</option>
            <option value="SHOP_OWNER">Shop Owner</option>
        </select>

        <button type="submit">Register</button>
    </form>
    <div id="msg"></div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api";

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const password = document.getElementById('password').value;

        // Password length validation
        if (password.length < 8) {
            document.getElementById('msg').innerHTML =
                `<div class="msg error">Password must be at least 8 characters long.</div>`;
            return;
        }

        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: password,
            role: document.getElementById('role').value
        };

        try {
            const res = await fetch(`${API_BASE}/users/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const contentType = res.headers.get("content-type");
            const data = contentType && contentType.includes("application/json")
                ? await res.json()
                : await res.text();

            if (res.ok) {
                document.getElementById('msg').innerHTML =
                    `<div class="msg success">Registered! Your User ID is <b>${data.id}</b>. Save this to log in.</div>`;
            } else {
                document.getElementById('msg').innerHTML = `<div class="msg error">${data}</div>`;
            }
        } catch (err) {
            document.getElementById('msg').innerHTML =
                `<div class="msg error">Could not reach backend. Is Spring Boot running on port 8080?</div>`;
        }
    });
</script>
</body>
</html>
