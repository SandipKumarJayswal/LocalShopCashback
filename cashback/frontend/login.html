<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - LocalShop Cashback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav><a href="register.html">Register</a><a href="login.html">Login</a><a href="dashboard.html">Dashboard</a></nav>
<div class="container">
    <h1>Login</h1>
    <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
    </form>
    <p style="margin-top: 15px; font-size: 13px;"><a href="forgot-password.html">Forgot password?</a></p>

    <div id="msg"></div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api";

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch(`${API_BASE}/users/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const contentType = res.headers.get("content-type");
            const data = contentType && contentType.includes("application/json")
                ? await res.json()
                : await res.text();

            if (res.ok) {
                localStorage.setItem('userId', data.id);
                localStorage.setItem('userName', data.name);
                document.getElementById('msg').innerHTML =
                    `<div class="msg success">Welcome ${data.name}! Redirecting to dashboard...</div>`;
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } else {
                document.getElementById('msg').innerHTML = `<div class="msg error">${data}</div>`;
            }
        } catch (err) {
            document.getElementById('msg').innerHTML =
                `<div class="msg error">Could not reach backend. Is Spring Boot running on port 8080?</div>`;
        }
    });
</script>
</body>
</html>
